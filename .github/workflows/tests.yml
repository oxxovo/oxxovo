name: tests
on: [push, pull_request]
jobs:
  crypto:
    # CryptoBind v1i/v1ic/v1v tamper-rejection + cross-repo KAT regression guard
    # + moderation gate (flagged/fail-safe -> never public) invariant.
    # Zero deps: Node builtins only (server-only is stubbed by test-register.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: CryptoBind tamper-rejection + KAT + compose verify + moderation gate
        run: npm test
